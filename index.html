<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Neon Drift</title>
    <style>
      :root {
        --night: #07020f;
        --chalk: #f1edff;
        --haze: #a498cf;
        --signal: #00e5ff;
        --overdrive: #ff2bd6;
        --hazard: #ffc23d;
        --damage: #ff3b5c;
        --font: "Saira", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --slant: -12deg;
        --gutter: clamp(16px, 3vw, 36px);
        /* Major-third scale from 15px. */
        --t-xs: 12px;
        --t-s: 15px;
        --t-m: 19px;
        --t-l: 23px;
        --t-xl: 29px;
        --t-2xl: 37px;
        --t-3xl: 58px;
        --t-4xl: 90px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--night);
        color: var(--chalk);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      kbd {
        display: inline-block;
        min-width: 26px;
        padding: 3px 7px 2px;
        border: 1px solid rgba(241, 237, 255, 0.35);
        border-bottom-width: 2px;
        border-radius: 4px;
        font: 600 var(--t-xs) / 1.3 var(--font);
        text-align: center;
        color: var(--chalk);
      }

      /* ---------- HUD ---------- */
      /* Soft dark halo keeps HUD text legible over bright buildings and rails. */
      #hud { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.3s; text-shadow: 0 1px 3px rgba(7, 2, 15, 0.85), 0 0 12px rgba(7, 2, 15, 0.5); }
      #hud.hidden { opacity: 0; }
      .score-block { position: absolute; top: var(--gutter); left: var(--gutter); }
      .score {
        font: italic 700 var(--t-2xl) / 1 var(--font);
        font-stretch: 112%;
        font-variant-numeric: tabular-nums;
      }
      .dist { margin-top: 4px; font: 500 var(--t-s) / 1.3 var(--font); color: var(--haze); font-variant-numeric: tabular-nums; }

      .cluster {
        --s: 0;
        position: absolute;
        right: var(--gutter);
        bottom: var(--gutter);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .hull { display: flex; gap: 5px; margin-bottom: 2px; }
      .hull i { width: 26px; height: 7px; transform: skewX(var(--slant)); background: rgba(255, 59, 92, 0.18); }
      .hull i.on { background: var(--damage); }
      .hull.low i.on { animation: pulse 0.5s ease-in-out infinite alternate; }
      .hull i.lost { animation: lost 0.6s ease-out; }
      @keyframes pulse { to { opacity: 0.35; } }
      @keyframes lost { 0%, 40% { background: #fff; } 100% { background: rgba(255, 59, 92, 0.18); } }
      /* The one loud element: speed digits widen as the craft speeds up. */
      .speed { display: flex; align-items: baseline; gap: 8px; }
      #speed {
        font: italic 800 var(--t-4xl) / 0.82 var(--font);
        font-stretch: calc(100% + var(--s) * 25%);
        font-variant-numeric: tabular-nums;
        transition: color 0.2s, text-shadow 0.2s;
      }
      .unit { font: italic 600 var(--t-s) / 1 var(--font); color: var(--haze); }
      #hud.boosting #speed { color: #fff; text-shadow: 0 0 22px var(--overdrive), 0 0 3px var(--overdrive); }
      .boost-row { display: flex; align-items: center; gap: 12px; }
      .hint { font: 500 var(--t-s) / 1 var(--font); opacity: 0; transition: opacity 0.3s; }
      .hint.show { opacity: 0.9; }
      .gauge {
        width: clamp(160px, 24vw, 300px);
        height: 12px;
        transform: skewX(var(--slant));
        background: rgba(0, 229, 255, 0.14);
        -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(100% / 12 - 3px), transparent 0 calc(100% / 12));
        mask: repeating-linear-gradient(90deg, #000 0 calc(100% / 12 - 3px), transparent 0 calc(100% / 12));
      }
      #boost-fill { height: 100%; width: 0; background: var(--signal); transition: width 0.1s linear; }
      #hud.boosting #boost-fill { background: var(--overdrive); }

      /* ---------- Event text ---------- */
      .popups { position: fixed; left: 50%; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
      .pop { font: italic 700 var(--t-l) / 1.1 var(--font); font-stretch: 112%; white-space: nowrap; animation: ticker 1s ease-out forwards; }
      .pop.close { color: var(--hazard); }
      .pop.cell { color: var(--signal); }
      .pop.info { color: var(--chalk); }
      @keyframes ticker {
        0% { opacity: 0; transform: translateX(-60%); }
        15% { opacity: 1; transform: translateX(-50%); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: translateX(-30%); }
      }
      .banner { position: fixed; left: 0; right: 0; top: 20%; text-align: center; pointer-events: none; opacity: 0; }
      .banner.show { animation: sweep 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
      .banner span {
        display: inline-block;
        padding-bottom: 6px;
        border-bottom: 3px solid var(--signal);
        font: italic 800 clamp(48px, 9vw, 112px) / 1 var(--font);
        font-stretch: 125%;
      }
      @keyframes sweep {
        0% { opacity: 0; transform: translateX(-30vw); }
        20%, 70% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(30vw); }
      }
      #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 59, 92, 0.5)); transition: opacity 0.45s ease-out; }
      #flash.on { opacity: 1; transition: none; }

      /* ---------- Menus ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        padding: var(--gutter);
        background:
          linear-gradient(90deg, rgba(7, 2, 15, 0.9) 0%, rgba(7, 2, 15, 0.62) 38%, rgba(7, 2, 15, 0) 72%),
          linear-gradient(0deg, rgba(7, 2, 15, 0.6) 0%, rgba(7, 2, 15, 0) 45%);
        transition: opacity 0.35s;
        cursor: pointer;
      }
      .overlay.hidden { opacity: 0; pointer-events: none; }
      .panel { width: min(640px, 100%); }
      .wordmark {
        margin: 0;
        font: italic 800 clamp(56px, 11vw, 136px) / 0.88 var(--font);
        font-stretch: 125%;
        letter-spacing: -0.01em;
      }
      .heading { margin: 0; font: italic 800 clamp(40px, 6.5vw, var(--t-3xl)) / 1 var(--font); font-stretch: 118%; }
      /* Dashed lane line, the same rhythm as the track dividers, running off the right edge. */
      .lane {
        width: 100vw;
        height: 3px;
        margin: 20px 0 22px;
        background: repeating-linear-gradient(90deg, var(--signal) 0 56px, transparent 56px 76px);
        opacity: 0.85;
      }
      .lede { max-width: 42ch; margin: 0 0 26px; font: 400 var(--t-m) / 1.45 var(--font); color: var(--haze); }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin-bottom: 26px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 13px 24px;
        border: 0;
        background: var(--signal);
        color: var(--night);
        font: italic 700 var(--t-m) / 1 var(--font);
        font-stretch: 112%;
        transform: skewX(var(--slant));
        cursor: pointer;
      }
      .btn > * { transform: skewX(calc(-1 * var(--slant))); }
      .btn kbd { border-color: rgba(7, 2, 15, 0.35); color: var(--night); font-style: normal; }
      .btn:hover { background: #6af1ff; }
      .btn:focus-visible { outline: 2px solid var(--chalk); outline-offset: 4px; }
      .btn.secondary { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 1.5px rgba(241, 237, 255, 0.45); }
      .btn.secondary kbd { border-color: rgba(241, 237, 255, 0.35); color: var(--chalk); }
      .btn.secondary:hover { box-shadow: inset 0 0 0 1.5px var(--chalk); }
      .best { font: 500 var(--t-s) / 1.4 var(--font); color: var(--haze); }
      .best b { color: var(--chalk); font-weight: 600; font-variant-numeric: tabular-nums; }
      .badge { display: inline-block; padding: 6px 14px; background: var(--overdrive); color: var(--night); font: italic 700 var(--t-s) / 1 var(--font); transform: skewX(var(--slant)); }
      .badge > span { display: inline-block; transform: skewX(calc(-1 * var(--slant))); }
      .controls { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 0; font: 400 var(--t-s) / 1.4 var(--font); color: var(--haze); }
      .controls div { display: flex; align-items: center; gap: 6px; }
      .controls dt { display: flex; align-items: center; gap: 4px; }
      .controls dd { margin: 0 0 0 4px; }
      .stats { display: flex; flex-wrap: wrap; gap: 18px 44px; margin: 24px 0 22px; }
      .stat b { display: block; font: italic 700 var(--t-2xl) / 1 var(--font); font-stretch: 112%; font-variant-numeric: tabular-nums; }
      .stat span { font: 400 var(--t-s) / 1.6 var(--font); color: var(--haze); }
      .result { margin-bottom: 24px; }
      .error { max-width: 44ch; font: 400 var(--t-m) / 1.45 var(--font); color: var(--chalk); }

      @media (max-width: 640px) {
        :root { --t-4xl: 58px; --t-2xl: 29px; }
        .boost-row { flex-direction: column; align-items: flex-end; gap: 6px; }
        .lede { font-size: var(--t-s); }
        .overlay { background: linear-gradient(0deg, rgba(7, 2, 15, 0.92) 0%, rgba(7, 2, 15, 0.7) 55%, rgba(7, 2, 15, 0.2) 100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pop { animation-name: fade; }
        .banner.show { animation-name: fade; }
        .hull.low i.on { animation: none; }
        @keyframes fade { 0%, 100% { opacity: 0; } 20%, 70% { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hidden" aria-hidden="true">
      <div class="score-block">
        <div id="score" class="score">0</div>
        <div id="dist" class="dist">0 m</div>
      </div>
      <div id="cluster" class="cluster">
        <div id="hull" class="hull"></div>
        <div class="speed"><span id="speed">0</span><span class="unit">km/h</span></div>
        <div class="boost-row">
          <span id="boost-hint" class="hint"></span>
          <div class="gauge"><div id="boost-fill"></div></div>
        </div>
      </div>
    </div>
    <div id="banner" class="banner"></div>
    <div id="popups" class="popups" aria-live="polite"></div>
    <div id="flash"></div>
    <div id="overlay" class="overlay">
      <div id="panel" class="panel"><p class="lede">Loading the track…</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
